<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(localStorage.getItem('ideaz_theme')!=='dark')document.documentElement.classList.add('light');}catch(e){document.documentElement.classList.add('light');}</script>
  <title>Egresos – IDEAZ Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { brand: { DEFAULT: '#6366f1', light: '#818cf8', dark: '#4f46e5' } }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/main.css?v=20261026">
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

<!-- SIDEBAR -->
<aside id="app-sidebar" class="fixed left-0 top-0 h-screen w-64 bg-slate-900 border-r border-slate-700 flex flex-col z-50 overflow-y-auto"></aside>

<!-- MAIN -->
<main class="ml-64 min-h-screen">
  <div class="p-4 sm:p-6 max-w-7xl mx-auto">

    <!-- Header -->
    <div class="flex items-end justify-between mb-6 flex-wrap gap-4">
      <div class="min-w-0">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-100">Egresos</h1>
        <p class="text-slate-400 text-sm mt-1">Gastos y préstamos del equipo — lo que sale de las cuentas de la agencia</p>
      </div>
      <button onclick="Egresos.openForm()" class="ui-chip ui-chip-primary w-full sm:w-auto"><span data-icon="plus"></span>Registrar egreso</button>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
      <div class="bento-card bento-ink">
        <div class="flex items-center justify-between gap-3">
          <p class="bento-label" style="color:#a8a29e">Gastos este mes</p>
          <span data-icon="wallet" data-size="w-5 h-5" style="color:#a8a29e"></span>
        </div>
        <p id="stat-gastos-mes" class="text-3xl sm:text-4xl font-extrabold mt-2 break-words">—</p>
      </div>
      <div class="bento-card bento-amber">
        <div class="flex items-center justify-between gap-3">
          <p class="bento-label" style="color:#78350f">Préstamos pendientes de reembolsar</p>
          <span data-icon="clock" data-size="w-5 h-5" style="color:#78350f"></span>
        </div>
        <p id="stat-prestamos-pendientes" class="text-3xl sm:text-4xl font-extrabold mt-2 break-words">—</p>
      </div>
    </div>

    <!-- Filtros -->
    <div class="ui-toolbar sticky top-[3.25rem] md:top-0 z-30 -mx-4 sm:-mx-6 px-4 sm:px-6 py-3 mb-4">
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1.5 flex-1 min-w-[260px] sm:flex-none">
          <label class="ui-field flex-1" title="Desde">
            <input type="date" id="f-date-from" class="ui-input" style="padding:0 .6rem 0 .9rem">
          </label>
          <span class="text-slate-500 text-sm">→</span>
          <label class="ui-field flex-1" title="Hasta">
            <input type="date" id="f-date-to" class="ui-input" style="padding:0 .6rem 0 .9rem">
          </label>
        </div>
        <label class="ui-field flex-1 min-w-[150px] sm:flex-none">
          <span data-icon="wallet"></span>
          <select id="f-type" class="ui-select">
            <option value="">Todos los tipos</option>
            <option value="gasto">Gasto</option>
            <option value="prestamo">Préstamo</option>
          </select>
          <span data-icon="chevron" class="ui-field-end"></span>
        </label>
        <label class="ui-field flex-1 min-w-[190px] sm:flex-none">
          <span data-icon="clock"></span>
          <select id="f-reimbursement" class="ui-select">
            <option value="">Cualquier estado</option>
            <option value="pendiente">Pendiente de reembolso</option>
            <option value="reembolsado">Reembolsado</option>
          </select>
          <span data-icon="chevron" class="ui-field-end"></span>
        </label>
        <label class="ui-field flex-1 min-w-[150px] sm:flex-none sm:w-44">
          <span data-icon="tag"></span>
          <input type="text" id="f-category" placeholder="Categoría…" list="egresos-category-suggestions" class="ui-input">
        </label>
        <datalist id="egresos-category-suggestions"></datalist>
        <button id="f-clear" type="button" class="ui-chip"><span data-icon="x"></span>Limpiar</button>
        <span id="egresos-count" class="w-full sm:w-auto sm:ml-auto text-xs font-semibold text-slate-400 text-center sm:text-right"></span>
      </div>
    </div>

    <!-- Tabla (desktop) / tarjetas (mobile) -->
    <div id="egresos-table-wrap" class="bento-card !p-0 overflow-hidden">
      <p class="text-slate-500 text-sm p-4">Cargando…</p>
    </div>

  </div>
</main>

<script src="js/session.js"></script>
<script src="js/storage.js?v=20260831"></script>
<script src="js/sidebar.js?v=20261026"></script>
<script src="js/utils.js?v=20260831"></script>
<script src="js/egresos.js?v=20261021"></script>
<script src="js/alarm.js?v=20260831"></script>
<script>
  Session.ready.then(() => {
    Sidebar.init('egresos');
    Egresos.init();
    Alarm.init();
  });
</script>
</body>
</html>
