<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(localStorage.getItem('ideaz_theme')!=='dark')document.documentElement.classList.add('light');}catch(e){document.documentElement.classList.add('light');}</script>
  <title>Monitor de Pauta – IDEAZ Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { brand: { DEFAULT: '#6366f1', light: '#818cf8', dark: '#4f46e5' } }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/main.css?v=20261026">
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

<!-- SIDEBAR -->
<aside id="app-sidebar" class="fixed left-0 top-0 h-screen w-64 bg-slate-900 border-r border-slate-700 flex flex-col z-50 overflow-y-auto">
  <div class="p-3 border-t border-slate-700 flex-shrink-0 sidebar-text mt-auto">
    <span class="text-xs text-slate-400" id="last-updated"></span>
  </div>
</aside>

<!-- MAIN -->
<main class="ml-64 min-h-screen">
  <div class="p-6 max-w-7xl mx-auto">

    <!-- Header -->
    <div class="mb-4">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-100">Monitor de Pauta Digital</h1>
      <p class="text-slate-400 text-sm mt-1">Seguimiento de presupuesto por cliente y plataforma en tiempo real</p>
    </div>

    <!-- Controles (barra fija) -->
    <div class="ui-toolbar sticky top-[3.25rem] md:top-0 z-30 -mx-6 px-6 py-3 mb-6">
      <div class="flex items-center gap-2 flex-wrap">
        <!-- Quick buttons -->
        <button id="btn-this" onclick="PautaMonitor.setThisMonth(); PautaMonitor.loadData()" class="ui-chip bg-indigo-600 text-white">Este mes</button>
        <button id="btn-last" onclick="PautaMonitor.setLastMonth(); PautaMonitor.loadData()" class="ui-chip bg-slate-800 text-slate-300">Mes anterior</button>

        <!-- Date range -->
        <label class="ui-field" title="Desde"><input type="date" id="p-from" onchange="PautaMonitor._markQuick('custom')" class="ui-input" style="padding:0 .6rem 0 .9rem"></label>
        <span class="text-slate-500 text-sm">→</span>
        <label class="ui-field" title="Hasta"><input type="date" id="p-to" onchange="PautaMonitor._markQuick('custom')" class="ui-input" style="padding:0 .6rem 0 .9rem"></label>

        <!-- Refresh -->
        <button id="p-refresh" onclick="PautaMonitor.loadData(true)" class="ui-chip">
          <span id="p-spinner" style="display:none" class="w-3.5 h-3.5 border-2 border-slate-600 border-t-indigo-400 rounded-full animate-spin"></span>
          <span data-icon="refresh"></span>Actualizar
        </button>

        <!-- Add client -->
        <button onclick="PautaMonitor.openClientModal()" class="ui-chip ui-chip-primary"><span data-icon="plus"></span>Cliente</button>
      </div>
    </div>

    <!-- Leyenda de alertas -->
    <div class="flex items-center gap-4 mb-6 text-xs text-slate-400 flex-wrap">
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> En presupuesto
      </span>
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 inline-block"></span> Por encima del ritmo diario (+5%) o cerca del límite (+85%)
      </span>
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span> Ritmo diario excedido (+20%) o presupuesto superado
      </span>
      <span class="ml-auto flex items-center gap-3">
        <span class="inline-flex items-center gap-1"><span data-icon="zap" data-size="w-3 h-3"></span>= gasto diario elevado</span>
        <span class="inline-flex items-center gap-1"><span class="inline-block w-2 h-2 rounded-full bg-red-500 align-middle"></span> = presupuesto en riesgo</span>
        <span>✓ = ritmo normal</span>
      </span>
    </div>

    <!-- Filtros -->
    <div class="flex items-center gap-2 mb-5 flex-wrap">
      <span class="text-xs text-slate-500 mr-1">Filtrar:</span>
      <button id="f-period-label"
        onclick="PautaMonitor.toggleFilter('period')"
        class="ui-chip border-slate-700 text-slate-400 select-none">
        <span id="f-period-dot" class="w-2 h-2 rounded-full bg-slate-600 flex-shrink-0"></span>
        Con pauta en el período
      </button>
      <button id="f-now-label"
        onclick="PautaMonitor.toggleFilter('now')"
        class="ui-chip border-slate-700 text-slate-400 select-none">
        <span id="f-now-dot" class="w-2 h-2 rounded-full bg-slate-600 flex-shrink-0"></span>
        Solo activos ahora
      </button>
      <!-- Marcas con la pauta detenida o en riesgo por pago / presupuesto -->
      <button id="f-pay-label"
        onclick="PautaMonitor.toggleFilter('pay')"
        class="ui-chip border-slate-700 text-slate-400 select-none">
        <span id="f-pay-dot" class="w-2 h-2 rounded-full bg-slate-600 flex-shrink-0"></span>
        Requieren atención <span id="f-pay-count" class="bento-pill bg-red-500/15 text-red-400" style="display:none"></span>
      </button>
      <span id="pauta-count" class="ml-auto text-xs text-slate-500"></span>
      <!-- Conexión con Google Ads (la llena pauta.js) -->
      <button type="button" id="g-ads-btn" class="ui-chip" style="display:none" onclick="PautaMonitor.openGoogleAdsModal()"></button>
    </div>

    <!-- Avisos (resultado de "Conectar Google Ads") -->
    <div id="pauta-notice" style="display:none" class="mb-5"></div>

    <!-- Cards grid -->
    <div id="pauta-cards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></div>

  </div>
</main>

<script src="js/session.js"></script>
<script src="js/storage.js?v=20260630"></script>
<script src="js/sidebar.js?v=20261026"></script>
<script src="js/pauta.js?v=20261105"></script>
<script src="js/alarm.js?v=20260630"></script>
<script>
  Session.ready.then(() => {
    if (!Storage.hasCredentials()) window.location.href = 'configuracion.html';
    Sidebar.init('pauta');
    PautaMonitor.init();
    Alarm.init();
  });
</script>
</body>
</html>
